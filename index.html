<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaree CMES - Live Hourly Tunnel</title>
    <meta http-equiv="refresh" content="10">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#f1f5f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; color:#0f172a; }
        .card { background:#ffffff; border-radius:18px; max-width:540px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.08); border:1px solid #e2e8f0; overflow:hidden; }
        .header { background:#007a3d; color:#ffffff; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; }
        .title { font-size:17px; font-weight:800; }
        .badge { background:#dc2626; color:#ffffff; padding:4px 12px; border-radius:9999px; font-size:11px; font-weight:800; letter-spacing:0.5px; }
        .body { padding:24px; }
        .section-label { font-size:11px; font-weight:800; text-transform:uppercase; color:#64748b; margin-bottom:8px; display:flex; justify-content:space-between; }
        .url-box { background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:10px; padding:12px; word-break:break-all; font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; color:#0369a1; margin-bottom:20px; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 18px; border-radius:10px; text-decoration:none; font-weight:800; font-size:14px; margin-bottom:10px; transition:all 0.15s; }
        .btn-green { background:#007a3d; color:#ffffff; }
        .btn-green:hover { background:#005a2d; }
        .btn-blue { background:#0284c7; color:#ffffff; }
        .btn-purple { background:#7c3aed; color:#ffffff; }
        .qr-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px; text-align:center; margin-top:16px; }
        .qr-card img { border-radius:8px; border:1px solid #cbd5e1; background:#ffffff; padding:6px; }
        .footer { background:#f8fafc; border-top:1px solid #e2e8f0; padding:12px 24px; font-size:11px; color:#64748b; text-align:center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">⚡ Waaree CMES Hourly Tunnel</div>
            <div class="badge">OFFLINE</div>
        </div>
        <div class="body">
            <div class="section-label">
                <span>Active Tunnel Endpoint</span>
                <span>Port 5058</span>
            </div>
            <div class="url-box">Tunnel offline or restarting...</div>

            <a href="#" target="_blank" class="btn btn-green">🚀 Open Hourly Data Entry (/entry)</a>
            <a href="#" target="_blank" class="btn btn-blue">📊 Open MIS Dashboard (/mis)</a>
            <a href="#" target="_blank" class="btn btn-purple">📋 Open Daily Summary (/summary)</a>

            
        </div>
        <div class="footer">
            Last Updated: 2026-11-04 05:12:05 AM IST &bull; Auto-refreshes every 10s
        </div>
    </div>
</body>
</html>
