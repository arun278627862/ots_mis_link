<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaree CMES - Live Hourly Tunnel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#f1f5f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; color:#0f172a; }
        .card { background:#ffffff; border-radius:18px; max-width:540px; width:100%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.08); border:1px solid #e2e8f0; overflow:hidden; }
        .header { background:#007a3d; color:#ffffff; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; }
        .title { font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px; }
        .badge { background:#dc2626; color:#ffffff; padding:4px 12px; border-radius:9999px; font-size:11px; font-weight:800; letter-spacing:0.5px; transition:background 0.3s; }
        .badge.online { background:#16a34a; }
        .body { padding:24px; }
        .section-label { font-size:11px; font-weight:800; text-transform:uppercase; color:#64748b; margin-bottom:8px; display:flex; justify-content:space-between; }
        .url-box { background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:10px; padding:12px; word-break:break-all; font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; color:#0369a1; margin-bottom:20px; min-height:45px; display:flex; align-items:center; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 18px; border-radius:10px; text-decoration:none; font-weight:800; font-size:14px; margin-bottom:10px; transition:all 0.15s; }
        .btn-green { background:#007a3d; color:#ffffff; }
        .btn-green:hover { background:#005a2d; }
        .btn-blue { background:#0284c7; color:#ffffff; }
        .btn-blue:hover { background:#0369a1; }
        .btn-purple { background:#7c3aed; color:#ffffff; }
        .btn-purple:hover { background:#6d28d9; }
        .btn.disabled { opacity:0.5; pointer-events:none; }
        .qr-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px; text-align:center; margin-top:16px; display:none; }
        .qr-card img { border-radius:8px; border:1px solid #cbd5e1; background:#ffffff; padding:6px; width:180px; height:180px; }
        .footer { background:#f8fafc; border-top:1px solid #e2e8f0; padding:12px 24px; font-size:11px; color:#64748b; display:flex; justify-content:space-between; align-items:center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">⚡ Waaree CMES Hourly Tunnel</div>
            <div id="statusBadge" class="badge">OFFLINE</div>
        </div>
        <div class="body">
            <div class="section-label">
                <span>Active Tunnel Endpoint</span>
                <span>Port 5058</span>
            </div>
            <div id="tunnelUrlBox" class="url-box">Tunnel offline or checking...</div>

            <a id="btnEntry" href="#" target="_blank" class="btn btn-green disabled">🚀 Open Hourly Data Entry (/entry)</a>
            <a id="btnMis" href="#" target="_blank" class="btn btn-blue disabled">📊 Open MIS Dashboard (/mis)</a>
            <a id="btnSummary" href="#" target="_blank" class="btn btn-purple disabled">📋 Open Daily Summary (/summary)</a>

            <div id="qrCard" class="qr-card">
                <div style="font-size:12px; font-weight:700; margin-bottom:8px;">📱 Scan for Instant Mobile Entry</div>
                <img id="qrImg" src="" alt="QR Code">
            </div>
        </div>
        <div class="footer">
            <span id="lastUpdatedText">Syncing live tunnel...</span>
            <span style="font-size:10px; opacity:0.8;">Auto-sync: 5s</span>
        </div>
    </div>

    <script>
        const GIST_API = "https://api.github.com/gists/35f368f44fa7a5c338ee36fe37599f84";

        async function syncTunnelStatus() {
            try {
                // Fetch public Gist live data (no auth required)
                const res = await fetch(GIST_API + "?_=" + Date.now(), { cache: "no-store" });
                if (!res.ok) return;

                const data = await res.json();
                const portalFile = data.files && data.files["portal.json"];
                if (!portalFile || !portalFile.content) return;

                const info = JSON.parse(portalFile.content);
                const isOnline = (info.status || "").toLowerCase() === "online" && Boolean(info.url);
                const url = (info.url || "").trim();

                const badge = document.getElementById("statusBadge");
                const urlBox = document.getElementById("tunnelUrlBox");
                const btnEntry = document.getElementById("btnEntry");
                const btnMis = document.getElementById("btnMis");
                const btnSummary = document.getElementById("btnSummary");
                const qrCard = document.getElementById("qrCard");
                const qrImg = document.getElementById("qrImg");
                const footerText = document.getElementById("lastUpdatedText");

                if (isOnline) {
                    badge.textContent = "ONLINE";
                    badge.className = "badge online";
                    urlBox.textContent = url;

                    btnEntry.href = (info.routes && info.routes.entry) || (url + "/entry");
                    btnEntry.classList.remove("disabled");

                    btnMis.href = (info.routes && info.routes.mis) || (url + "/mis");
                    btnMis.classList.remove("disabled");

                    btnSummary.href = (info.routes && info.routes.summary) || (url + "/summary");
                    btnSummary.classList.remove("disabled");

                    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(btnEntry.href);
                    qrCard.style.display = "block";
                } else {
                    badge.textContent = "OFFLINE";
                    badge.className = "badge";
                    urlBox.textContent = "Tunnel offline or restarting...";

                    btnEntry.href = "#";
                    btnEntry.classList.add("disabled");

                    btnMis.href = "#";
                    btnMis.classList.add("disabled");

                    btnSummary.href = "#";
                    btnSummary.classList.add("disabled");

                    qrCard.style.display = "none";
                }

                if (info.updated_at_human) {
                    footerText.textContent = "Last Updated: " + info.updated_at_human;
                } else if (info.updated_at) {
                    footerText.textContent = "Last Updated: " + new Date(info.updated_at).toLocaleTimeString();
                }
            } catch (err) {
                console.warn("[Live Sync Notice]:", err);
            }
        }

        // Run immediately on load
        syncTunnelStatus();
        // Auto check every 5 seconds
        setInterval(syncTunnelStatus, 5000);
    </script>
</body>
</html>
